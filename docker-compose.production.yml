version: '3.8'

services:
  vucar-app:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_TAG:-latest}
    container_name: vucar-app-production
    ports:
      - "3000:3000"  # VuCar app on port 3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=vucar.syledevops.live
      - NEXTAUTH_URL=https://vucar.syledevops.live
      # Add other environment variables as needed
      # - DATABASE_URL=${DATABASE_URL}
      # - API_KEY=${API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

