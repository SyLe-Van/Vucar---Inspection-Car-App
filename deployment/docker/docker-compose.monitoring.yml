
version: '3.8'

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: vucar-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d' 
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    labels:
      - "com.vucar.service=prometheus"
      - "com.vucar.description=Prometheus metrics server"

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: vucar-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" 
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123 
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring
    labels:
      - "com.vucar.service=grafana"
      - "com.vucar.description=Grafana dashboards"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vucar-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoring
    labels:
      - "com.vucar.service=node-exporter"
      - "com.vucar.description=Node/system metrics exporter"

# Volumes for persistent data
volumes:
  prometheus-data:
    driver: local
    labels:
      - "com.vucar.volume=prometheus-data"
      
  grafana-data:
    driver: local
    labels:
      - "com.vucar.volume=grafana-data"

# Network for monitoring services
networks:
  monitoring:
    driver: bridge
    labels:
      - "com.vucar.network=monitoring"
