version: '3.8'

services:
  vucar-app:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_NAME:-syle712/vucar-app}:${DOCKER_TAG:-latest}
    container_name: vucar-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - vucar-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vucar-network:
    driver: bridge